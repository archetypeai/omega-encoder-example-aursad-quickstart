# Local broker for the Omega AURSAD monitor. TCP for the serving bridge and the
# replayer, WebSockets for the browser: the app has no backend, so the page talks
# to mosquitto directly.
#
# Ports chosen not to clash with the other example apps, past the TEP app
# (1890 / 9008 / 5180) and the two slots after it, so they can run side by side:
#
#   app                            MQTT TCP  MQTT WS  Web
#   AD TEP, served                 1890      9008     5180
#   Omega AURSAD, served (this)    1893      9011     5183
listener 1893 127.0.0.1
allow_anonymous true

listener 9011 127.0.0.1
protocol websockets
allow_anonymous true
